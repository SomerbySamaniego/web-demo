<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My First Website</title>
    <style>
     
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6; 
            color: #333;               
            display: flex;
            flex-direction: column;
            align-items: center;      
            justify-content: center;   
            height: 100vh;            
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;     
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            text-align: center;
            border-top: 5px solid #007bff; 
        }

        h2 {
            color: #007bff;            
            margin-bottom: 10px;
        }

        p {
            font-size: 1.1rem;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Hello, Web!</h2>
        <p>This site is live.</p>
        </div>

</body>
</html>
